name: Release

# Builds webview2gtk-setup.exe + MSYS2 pacman package on Windows and publishes
# release assets for tags like `v0.2.0` (same trigger pattern as OLLMchat).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: strict
          update: true
          install: >-
            base-devel
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libgee
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nsis

      - name: Build pacman package
        run: ./scripts/build-pacman-package.sh

      - name: Build NSIS installer
        run: |
          ./scripts/vendor-webview2-sdk.sh
          mkdir -p dist
          meson setup build --prefix="$(pwd)/dist/webview2gtk"
          meson compile -C build
          meson install -C build
          ./scripts/bundle-bin-runtime.sh dist/webview2gtk/bin
          ./scripts/build-installer.sh dist/webview2gtk

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp webview2gtk-setup.exe artifacts/
          cp packaging/msys2/mingw-w64-ucrt-x86_64-webview2gtk-*.pkg.tar.zst artifacts/
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: webview2gtk-windows-x64
          path: artifacts/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          overwrite: true
