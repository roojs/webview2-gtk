name: Release

# Builds webview2gtk-setup.exe + MSYS2 pacman package on Windows and publishes
# release assets for tags like `v0.1.0` (same trigger pattern as OLLMchat).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nsis

      - name: Build pacman package
        run: ./scripts/build-pacman-package.sh

      - name: Build NSIS installer
        run: |
          ./scripts/vendor-webview2-sdk.sh
          meson setup build --prefix=/webview2gtk
          meson compile -C build
          meson install -C build --destdir="$PWD/dist"
          ./scripts/build-installer.sh dist/webview2gtk

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp webview2gtk-setup.exe artifacts/
          cp packaging/msys2/mingw-w64-ucrt-x86_64-webview2gtk-*.pkg.tar.zst artifacts/
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: webview2gtk-windows-x64
          path: artifacts/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --clobber
