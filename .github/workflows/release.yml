name: Release

# Builds webview2gtk-setup.exe + MSYS2 pacman package on Windows and publishes
# release assets for tags like `v0.2.0` (same trigger pattern as OLLMchat).
#
# Pacman remote installs need a companion .sig. Tag releases sign the package
# with WEBVIEW2GTK_GPG_PRIVATE_KEY (see docs/plans/0.3-pacman-package-signatures.md).
#
# One meson compile feeds both the .pkg.tar.zst and the NSIS installer.
# WebView2 NuGet + ccache are cached across runs. Examples link the staged
# static lib (no triple Vala rebuild). `meson install` no longer rebuilds lib
# (stamp file is written).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v5

      - name: Read WebView2 SDK version
        id: webview2-sdk
        shell: bash
        run: |
          ver="$(grep -v '^#' metadata/webview2-sdk-ref.txt | grep -v '^[[:space:]]*$' | head -1)"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Restore WebView2 NuGet cache
        id: cache-webview2
        uses: actions/cache@v6
        with:
          path: build/vendor/webview2.nupkg
          key: webview2-nupkg-${{ steps.webview2-sdk.outputs.version }}

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-ucrt64-${{ hashFiles('scripts/wv2gtk-build.sh', 'lib/**/*.c', 'lib/**/*.vala', 'generated/**/*.c') }}
          restore-keys: |
            ccache-ucrt64-

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: strict
          update: true
          install: >-
            base-devel
            gnupg
            unzip
            ccache
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libgee
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nsis

      - name: Import packager GPG key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WEBVIEW2GTK_GPG_PRIVATE_KEY: ${{ secrets.WEBVIEW2GTK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBVIEW2GTK_GPG_PRIVATE_KEY:-}" ]]; then
            echo "WEBVIEW2GTK_GPG_PRIVATE_KEY secret is required for tag releases (package .sig)." >&2
            exit 1
          fi
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          # Non-interactive signing for makepkg --sign (CI has no pinentry TTY).
          # Use printf (not a column-0 heredoc) so YAML block scalars stay valid.
          printf '%s\n' 'batch' 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
          printf '%s\n' 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$WEBVIEW2GTK_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [[ -z "$FPR" ]]; then
            echo "gpg import produced no secret key fingerprint" >&2
            exit 1
          fi
          echo "GPGKEY=$FPR" >> "$GITHUB_ENV"
          echo "Imported packager key $FPR"

      - name: Build package + installer (single compile)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
        run: |
          set -euo pipefail
          export CCACHE_DIR
          export PATH="/usr/bin:${PATH}"
          if command -v ccache >/dev/null 2>&1; then
            ccache -z || true
            export CC="ccache cc"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export PKGVER="${GITHUB_REF#refs/tags/v}"
            echo "pkgver from tag: ${PKGVER}"
          fi
          if [[ -n "${GPGKEY:-}" ]]; then
            export GPGKEY
            ./scripts/ci-windows-release-build.sh --sign
          else
            ./scripts/ci-windows-release-build.sh
          fi
          if command -v ccache >/dev/null 2>&1; then
            ccache -s || true
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp webview2gtk-setup.exe artifacts/
          cp packaging/msys2/mingw-w64-ucrt-x86_64-webview2gtk-*.pkg.tar.zst artifacts/
          if compgen -G 'packaging/msys2/mingw-w64-ucrt-x86_64-webview2gtk-*.pkg.tar.zst.sig' > /dev/null; then
            cp packaging/msys2/mingw-w64-ucrt-x86_64-webview2gtk-*.pkg.tar.zst.sig artifacts/
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "Tag release requires a .sig next to the package" >&2
            exit 1
          fi
          ls -lh artifacts

      - name: Render release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/release/changelog.sh
          scripts/release/changelog.sh release-notes "${GITHUB_REF#refs/tags/}" -o release-notes.md
          echo "---- release-notes.md ----"
          cat release-notes.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: webview2gtk-windows-x64
          path: artifacts/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/*
          overwrite_files: true
